<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS3 Bank Overlay Companion</title>
    <style>
        :root {
            --rs-bg: #0f141a;
            --rs-panel: #1b222c;
            --rs-border: #3a4757;
            --rs-accent: #ff9800;
            --rs-text: #e2e8f0;
            --rs-text-dark: #8a9ba8;
        }

        body {
            background-color: var(--rs-bg);
            color: var(--rs-text);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 12px;
            font-size: 14px;
        }

        .header {
            border-bottom: 2px solid var(--rs-border);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        h2 {
            color: var(--rs-accent);
            margin: 0;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-box {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--rs-border);
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--rs-text-dark);
            margin-bottom: 16px;
        }

        .btn {
            background-color: var(--rs-accent);
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #e08600;
        }

        .grid-container {
            margin-top: 20px;
        }

        .grid-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--rs-accent);
            font-size: 13px;
        }

        /* Simulates an 8-column RS3 Bank Tab row structure */
        .bank-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            background-color: var(--rs-panel);
            padding: 8px;
            border: 1px solid var(--rs-border);
            border-radius: 4px;
        }

        .bank-slot {
            aspect-ratio: 1;
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-align: center;
            color: var(--rs-text-dark);
            border-radius: 2px;
            cursor: pointer;
            user-select: none;
            padding: 2px;
        }

        .bank-slot:hover {
            border-color: var(--rs-accent);
            color: #fff;
        }

        /* Blueprint Layout Color Themes */
        .slot-combat { background-color: rgba(239, 68, 68, 0.25); border-color: #ef4444; color: #fca5a5; }
        .slot-potions { background-color: rgba(34, 197, 94, 0.25); border-color: #22c55e; color: #86efac; }
        .slot-skilling { background-color: rgba(59, 130, 246, 0.25); border-color: #3b82f6; color: #93c5fd; }
        .slot-junk { background-color: rgba(107, 114, 128, 0.25); border-color: #6b7280; color: #d1d5db; }

        .legend {
            margin-top: 12px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            font-size: 11px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid currentColor;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>🏛️ Bank Organizer Overlay</h2>
    </div>

    <div class="status-box" id="status-display">
        Alt1 Status: Initializing...
    </div>

    <button class="btn" id="scan-btn">Verify Game Bounding Box</button>

    <div class="grid-container">
        <div class="grid-title">💡 Target Blueprint Grid (8x6 Row Mapping)</div>
        
        <div class="bank-grid" id="bank-blueprint">
            <!-- JavaScript dynamically renders rows here -->
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="legend-color slot-combat"></div><span>Combat / Armor</span></div>
        <div class="legend-item"><div class="legend-color slot-potions"></div><span>Herblore / Food</span></div>
        <div class="legend-item"><div class="legend-color slot-skilling"></div><span>Skilling Mats</span></div>
        <div class="legend-item"><div class="legend-color slot-junk"></div><span>Trash / Diango</span></div>
    </div>

    <!-- Official Alt1 Base Injection API via CDN -->
    <script src="https://jsdelivr.net"></script>
    <script>
        const statusDisplay = document.getElementById('status-display');
        const scanBtn = document.getElementById('scan-btn');
        const blueprintContainer = document.getElementById('bank-blueprint');

        // Target organization layout profile (48 total bank item slots mapped out)
        // C = Combat, P = Potions, S = Skilling, J = Junk/Clean up
        const targetLayout = [
            'C','C','C','C','C','C','C','C',
            'C','C','C','C','P','P','P','P',
            'P','P','P','P','P','P','P','P',
            'S','S','S','S','S','S','S','S',
            'S','S','S','S','J','J','J','J',
            'J','J','J','J','J','J','J','J'
        ];

        // Label details for rendering templates inside the mockup squares
        const typeLabels = { 'C': '⚔️', 'P': '🧪', 'S': '🪵', 'J': '🗑️' };
        const classNames = { 'C': 'slot-combat', 'P': 'slot-potions', 'S': 'slot-skilling', 'J': 'slot-junk' };

        // Render the mockup grid preview structures
        targetLayout.forEach((type, index) => {
            const slot = document.createElement('div');
            slot.classList.add('bank-slot', classNames[type]);
            slot.innerHTML = `${typeLabels[type]}<br>#${index + 1}`;
            blueprintContainer.appendChild(slot);
        });

        // Initialize Alt1 hooks check parameters
        function checkAlt1() {
            if (window.alt1 && window.alt1.permissionPixel) {
                statusDisplay.innerText = "Alt1 Status: Ready. Embedded graphics access confirmed.";
            } else {
                statusDisplay.innerText = "Alt1 Status: Idle. Load this URL inside the desktop Alt1 Toolkit Toolkit Browser.";
            }
        }

        scanBtn.addEventListener('click', () => {
            if (window.alt1 && window.alt1.permissionPixel) {
                statusDisplay.innerText = "Scanning client bounds...";
                try {
                    // Pulls raw image layout buffer data structure boundaries from active app canvas
                    let img = alt1.bindRegion(0, 0, alt1.rsWidth, alt1.rsHeight);
                    if (img) {
                        statusDisplay.innerHTML = `Connected!<br>Target Game Frame Resolution: ${alt1.rsWidth}x${alt1.rsHeight}`;
                    } else {
                        statusDisplay.innerText = "Error: Could not locate RS3 game window context frame.";
                    }
                } catch (err) {
                    statusDisplay.innerText = "Execution error: Check tracking permissions.";
                }
            } else {
                statusDisplay.innerText = "Error: Screen-reading hooks missing. Verify Alt1 Toolkit execution environment.";
            }
        });

        // Loop check on page spin-up
        setTimeout(checkAlt1, 1000);
    </script>
</body>
</html>
