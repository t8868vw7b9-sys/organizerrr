<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS3 Ultimate Row Organizer</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #e2e8f0;
            font-family: sans-serif;
            margin: 0;
            padding: 12px;
            font-size: 13px;
        }
        h2 { color: #ff9800; font-size: 14px; margin: 0 0 10px 0; border-bottom: 2px solid #2e3b4e; padding-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .instruction-text { color: #7a8b9e; font-size: 11px; margin-bottom: 12px; line-height: 1.4; }
        
        /* Tab Selectors */
        .tab-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }
        .tab-btn {
            background-color: #141b24;
            border: 1px solid #2e3b4e;
            color: #a3b8cc;
            padding: 8px 4px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        .tab-btn:hover { border-color: #ff9800; color: #fff; }
        .tab-btn.active { background-color: #ff9800; color: #000; border-color: #ff9800; }

        /* Blueprint Layout Display */
        .blueprint-container {
            background: #141b24;
            border: 1px solid #2e3b4e;
            border-radius: 4px;
            padding: 12px;
        }
        .blueprint-title {
            color: #ff9800;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .blueprint-subtitle {
            color: #7a8b9e;
            font-size: 11px;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .row-guide {
            margin-bottom: 12px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-left: 3px solid #ff9800;
            border-radius: 0 4px 4px 0;
        }
        .row-num {
            font-size: 11px;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .row-items {
            color: #ffffff;
            font-size: 12px;
            line-height: 1.4;
        }
        .row-tip {
            font-size: 11px;
            color: #a3b8cc;
            margin-top: 3px;
            font-style: italic;
        }
        .trash { border-left-color: #fca5a5; }
        .trash .row-num { color: #fca5a5; }
    </style>
</head>
<body>

    <h2>🏛️ Row-by-Row Organizer</h2>
    <div class="instruction-text">
        Click a tab button below to see exactly which items belong on rows 1, 2, and 3 of that specific in-game tab.
    </div>

    <!-- Quick Sidebar Selector Grid -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab(2)">Tab 2: Gear</button>
        <button class="tab-btn" onclick="switchTab(3)">Tab 3: PvM Pots</button>
        <button class="tab-btn" onclick="switchTab(4)">Tab 4: Runes</button>
        <button class="tab-btn" onclick="switchTab(5)">Tab 5: Skill</button>
        <button class="tab-btn" onclick="switchTab(6)">Tab 6: Farm</button>
        <button class="tab-btn" onclick="switchTab(9)">Tab 9: Junk</button>
    </div>

    <!-- Dynamic Display Panel -->
    <div class="blueprint-container" id="blueprint-display">
        <!-- Javascript dynamically injects the chosen tab rows here -->
    </div>

    <script>
        // High-efficiency row arrangements for RS3 banking grids
        const rowData = {
            2: {
                title: "⚔️ Tab 2: Combat & Armor Layout",
                sub: "Organize items vertically so you can scan full sets at a glance.",
                rows: [
                    { label: "Row 1 (Weapons)", items: "Noxious Weapons, Masterwork/Sirenic pieces, Shields, Defenders, T90/T95 mainhands.", tip: "Keep your highest-tier active weapons in slots 1-5." },
                    { label: "Row 2 (Melee & Range Armor)", items: "Custom-Fit Trimmed Masterwork sets, Elite Sirenic gear, Capes of Accomplishment.", tip: "Line up Helm, Body, and Legs vertically under the weapons." },
                    { label: "Row 3 (Mage & Necro Gear)", items: "Elite Tectonic sets, First Necromancer robes, Omniguard, Soulbound Lantern.", tip: "Keep combat rings (Death, Asylum) and necklaces at the end of Row 3." }
                ]
            },
            3: {
                title: "🧪 Tab 3: Herblore & Food Layout",
                sub: "Always use Placeholder Locks so empty flask slots don't disappear!",
                rows: [
                    { label: "Row 1 (Overloads)", items: "Elder Overload Flasks (6), Overload (4), Aggroverload Flasks, Weapon Poison+++.", tip: "Put your 6-dose variants on the left, and lower doses next to them." },
                    { label: "Row 2 (Stat Restores)", items: "Saradomin Brew Flasks (6), Super Restore Flasks (6), Adrenaline Renewals.", tip: "Pair a row of Brews directly above or below your food source." },
                    { label: "Row 3 (Food & Pocket)", items: "Sailfish, Blue Blubber Jellyfish, Rocktails, Scrimshaws, God Books.", tip: "Keep solid food and combo food (jellyfish) together for fast clicking." }
                ]
            },
            4: {
                title: "🏃 Tab 4: Daily Runs & Teleports",
                sub: "Your go-to tab for daily tasks and map mobility.",
                rows: [
                    { label: "Row 1 (Runes & Pouches)", items: "Rune Pouches, Air, Fire, Water, Earth, Blood, Soul, Death, and Astral runes.", tip: "Keep standard elemental runes grouped near your primary teleport jewelry." },
                    { label: "Row 2 (Teleport Jewelry)", items: "Passage of the Abyss, Games Necklaces, Rings of Dueling, Amulets of Glory.", tip: "Put completely discharged jewelry at the far right of the row." },
                    { label: "Row 3 (Dailies)", items: "Wicked Hood, Vis Wax, Teleport Tablets, Portable Skill Stations.", tip: "Keep your daily skull scepters or wilderness event tokens here." }
                ]
            },
            5: {
                title: "🪵 Tab 5: Skilling Resources",
                sub: "Group raw materials with their matching processing items.",
                rows: [
                    { label: "Row 1 (Mining & Smithing)", items: "Light/Dark Animica, Runite Ore, Elder Rune Bars, Stone Spirits.", tip: "Put stone spirits directly below or next to their matching ore type." },
                    { label: "Row 2 (Woodcutting & Fletching)", items: "Elder Logs, Magic Logs, Yew Logs, Bowstrings, Headless Arrows, Feathers.", tip: "Keep arrows, shafts, and tips lined up in order of production step." },
                    { label: "Row 3 (Crafting & Invention)", items: "Uncut Onyx, Diamonds, Dragonhides, Resilient Components, Divine Charges.", tip: "Keep empty item siphons and gizmos on the far right." }
                ]
            },
            6: {
                title: "🧑‍🌾 Tab 6: Farming & Herbs",
                sub: "Clean herbs out regularly to save inventory grids.",
                rows: [
                    { label: "Row 1 (Grimy Herbs)", items: "Grimy Avantoe, Grimy Ranarr, Grimy Toadflax, Grimy Lantadyme.", tip: "Organize alphabetically or by herblore skill level." },
                    { label: "Row 2 (Clean Herbs)", items: "Clean Avantoe, Clean Ranarr, Clean Torstol, Clean Fellstalk.", tip: "Place clean variants directly under their grimy versions." },
                    { label: "Row 3 (Secondaries)", items: "Crushed Nest, Eye of Newt, Wine of Zamorak, Limpwurt Roots.", tip: "Keep common potion ingredients matched with the herbs above." }
                ]
            },
            9: {
                title: "🗑️ Tab 9: Junk & Toy Box Cleanup",
                sub: "These items are wasting space. Run through this row immediately!",
                isTrash: true,
                rows: [
                    { label: "Row 1 (Holiday Clutter)", items: "Old Easter drops, Christmas cosmetics, Hati cosmetic claws.", tip: "Destroy them! Right-click -> Destroy. You can fetch them back from Diango for free." },
                    { label: "Row 2 (Quest Leftovers)", items: "Strange glowing keys, dynamic quest scrolls, ancient notes.", tip: "Check your quest list. If the quest is finished, delete these or add them to May's Quest Caravan." },
                    { label: "Row 3 (Random Tokens)", items: "Low-tier treasure hunter tokens, outdated promotional keys.", tip: "Right-click and select 'Redeem' or turn them into oddments immediately." }
                ]
            }
        };

        function switchTab(tabId) {
            // Update active styling button states
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const data = rowData[tabId];
            const display = document.getElementById('blueprint-display');
            
            let html = `
                <div class="blueprint-title">${data.title}</div>
                <div class="blueprint-subtitle">${data.sub}</div>
            `;

            data.rows.forEach(row => {
                const trashClass = data.isTrash ? "trash" : "";
                html += `
                    <div class="row-guide ${trashClass}">
                        <div class="row-num">${row.label}</div>
                        <div class="row-items">${row.items}</div>
                        <div class="row-tip">${row.tip}</div>
                    </div>
                `;
            });

            display.innerHTML = html;
        }
