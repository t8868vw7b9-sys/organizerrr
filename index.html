<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS3 Live Bank Tab Sorter</title>
    <style>
        :root {
            --rs-bg: #0b0e14;
            --rs-panel: #141b24;
            --rs-border: #2e3b4e;
            --rs-accent: #ff9800;
            --rs-text: #e2e8f0;
            --rs-text-dark: #7a8b9e;
        }

        body {
            background-color: var(--rs-bg);
            color: var(--rs-text);
            font-family: sans-serif;
            margin: 0;
            padding: 12px;
            font-size: 13px;
        }

        h2 {
            color: var(--rs-accent);
            font-size: 15px;
            text-transform: uppercase;
            margin: 0 0 10px 0;
            border-bottom: 2px solid var(--rs-border);
            padding-bottom: 6px;
        }

        .status-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--rs-border);
            padding: 8px;
            border-radius: 4px;
            font-size: 11px;
            color: var(--rs-text-dark);
            margin-bottom: 12px;
        }

        .btn {
            background-color: var(--rs-accent);
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .btn:hover { background-color: #e08600; }

        .tab-section {
            background: var(--rs-panel);
            border: 1px solid var(--rs-border);
            border-radius: 4px;
            margin-bottom: 10px;
            padding: 8px;
        }

        .tab-title {
            font-weight: bold;
            color: var(--rs-accent);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 4px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .item-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-entry {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 12px;
        }

        .item-action {
            color: var(--rs-text-dark);
            font-size: 11px;
        }
    </style>
</head>
<body>

    <h2>🏛️ Live Bank Tab Sorter</h2>
    
    <div class="status-box" id="status">
        Alt1 Status: Ready. Open your bank and click scan.
    </div>

    <button class="btn" id="scan-btn">Scan Bank Screen</button>

    <div id="sorting-results">
        <!-- Directions will be dynamically pushed here by app.js -->
        <p style="text-align:center; color:var(--rs-text-dark);">Click scan to sort visible items.</p>
    </div>

    <!-- Load Alt1 APIs -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="app.js"></script>
</body>
</html>
