<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Bank Companion</title>
    <style>
        body {
            background-color: #0b0e14;
            color: #e2e8f0;
            font-family: sans-serif;
            margin: 0;
            padding: 12px;
            font-size: 13px;
        }
        h2 { color: #ff9800; font-size: 14px; margin: 0 0 10px 0; border-bottom: 2px solid #2e3b4e; padding-bottom: 6px; }
        .status-box { background: rgba(0,0,0,0.4); border: 1px solid #2e3b4e; padding: 10px; border-radius: 4px; font-size: 11px; color: #7a8b9e; margin-bottom: 12px; }
        .btn { background-color: #ff9800; color: #000; border: none; padding: 12px; font-weight: bold; width: 100%; cursor: pointer; border-radius: 4px; text-transform: uppercase; }
        .btn:hover { background-color: #e08600; }
        .tab-section { background: #141b24; border: 1px solid #2e3b4e; border-radius: 4px; margin-top: 15px; padding: 10px; }
        .tab-title { font-weight: bold; color: #ff9800; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; margin-bottom: 8px; }
        .item-entry { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.02); }
    </style>
</head>
<body>

    <h2>🏛️ Live Bank Tab Sorter</h2>
    
    <div class="status-box" id="status">
        <strong>System Status:</strong> Click Scan to connect.
    </div>

    <button class="btn" id="scan-button">Scan Current Screen</button>

    <div id="results"></div>

    <script>
        const status = document.getElementById('status');
        const btn = document.getElementById('scan-button');
        const results = document.getElementById('results');

        btn.addEventListener('click', function() {
            if (window.alt1) {
                try {
                    // Test reading the game client boundaries
                    let img = window.alt1.bindRegion(0, 0, window.alt1.rsWidth, window.alt1.rsHeight);
                    
                    if (img) {
                        status.innerHTML = `<span style='color:#22c55e;'>✔ Success! Connected at ${window.alt1.rsWidth}x${window.alt1.rsHeight}</span>`;
                        showLayoutChecklist();
                    } else {
                        status.innerHTML = `<span style='color:#fca5a5;'>❌ Screen Grab Blocked.<br>Change Windows text scaling and RS3 Interface scaling to exactly 100%.</span>`;
                    }
                } catch(e) {
                    status.innerHTML = `<span style='color:#fca5a5;'>❌ Access Denied.<br>Go to Alt1 Settings -> Capture -> Switch mode to "Desktop Capture".</span>`;
                }
            } else {
                status.innerHTML = "Viewing via web browser. Simulating sample layout below.";
                showLayoutChecklist();
            }
        });

        function showLayoutChecklist() {
            results.innerHTML = `
                <div class="tab-section">
                    <div class="tab-title">Tab 1: Combat Supplies</div>
                    <div class="item-entry"><span>⚔️ Noxious Scythe</span><span style="color:#7a8b9e">Slot 1</span></div>
                    <div class="item-entry"><span>🧪 Overload (4)</span><span style="color:#7a8b9e">Slot 2</span></div>
                </div>
                <div class="tab-section">
                    <div class="tab-title">Tab 2: Resources & Materials</div>
                    <div class="item-entry"><span>🪵 Elder Logs</span><span style="color:#7a8b9e">Slot 1</span></div>
                </div>
            `;
        }
    </script>
</body>
</html>
